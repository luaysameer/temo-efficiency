name: TEMO Efficiency Feedback
description: Share a real routing, misunderstanding, provider-discovery, portability, verification, or documentation result.
title: "[TEMO Feedback] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing TEMO Efficiency on a real workflow.
        Please share only the minimum reproducible evidence. Do not include passwords, API keys, private tokens, personal information, confidential code, or full private conversations.

  - type: dropdown
    id: language
    attributes:
      label: Language / اللغة
      options:
        - English
        - العربية
        - Other
    validations:
      required: true

  - type: dropdown
    id: feedback_mode
    attributes:
      label: Feedback mode
      options:
        - Manual
        - Ask-before-send
        - Auto-anonymous
    validations:
      required: true

  - type: input
    id: provider
    attributes:
      label: AI provider / tool
      description: ChatGPT, Codex, Claude, Claude Code, Gemini, Cursor, Cloud Code, local model, other, or Unknown.
      placeholder: e.g. ChatGPT
    validations:
      required: true

  - type: input
    id: temo_version
    attributes:
      label: TEMO Efficiency version
      placeholder: e.g. 1.5.0

  - type: dropdown
    id: signal_code
    attributes:
      label: Signal code
      options:
        - REPEATED_MISUNDERSTANDING
        - REPEATED_QUESTION
        - CONTEXT_MISS
        - EXECUTION_DRIFT
        - ROUTING_TOO_WEAK
        - ROUTING_TOO_STRONG
        - CATALOG_DISCOVERY_FAIL
        - CATALOG_HALLUCINATION_FAIL
        - BOOTSTRAP_FAIL
        - TOOL_ENVIRONMENT_MISMATCH
        - VERIFICATION_FAIL
        - LOCKED_PASS_REGRESSION
        - PORTABLE_FALLBACK_PASS
        - REGRESSION_GUARD_PASS
        - DOCUMENTATION_USABILITY
        - OTHER
    validations:
      required: true

  - type: dropdown
    id: confidence
    attributes:
      label: Signal confidence
      options:
        - Low
        - Medium
        - High
    validations:
      required: true

  - type: input
    id: retry_count
    attributes:
      label: Retry / correction count
      description: If relevant, how many times did the same requirement/question need to be repeated or corrected?
      placeholder: e.g. 3

  - type: textarea
    id: catalog
    attributes:
      label: Available models / levels (optional)
      description: Paste only exact visible labels if relevant. Screenshots are optional and should be redacted.
      placeholder: |
        Catalog status: VERIFIED_FULL / VERIFIED_CURRENT_ONLY / UNKNOWN
        Models: ...
        Levels/Thinking: ...
        Boost/Speed: ...

  - type: input
    id: initial_route
    attributes:
      label: Initial TEMO route
      placeholder: e.g. FAST / model X / Low

  - type: input
    id: escalation
    attributes:
      label: Escalation route (if any)
      placeholder: e.g. FAST → BALANCED, or none

  - type: dropdown
    id: result
    attributes:
      label: Result
      options:
        - PASS
        - PARTIAL
        - FAIL
    validations:
      required: true

  - type: textarea
    id: missed_contract
    attributes:
      label: Missed requirement / contract (if applicable)
      description: What exact requirement, constraint, prior answer, or PASS state was repeatedly missed?

  - type: textarea
    id: happened
    attributes:
      label: What happened?
      description: Keep it concise and reproducible.
      placeholder: Describe the observed behavior in 2–5 lines.
    validations:
      required: true

  - type: textarea
    id: likely_cause
    attributes:
      label: Likely cause (optional)
      description: Evidence-based only. Use Unknown if uncertain.

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      placeholder: Describe the expected TEMO behavior.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Minimal evidence
      description: Redact secrets and private data. Do not paste full private conversations unless necessary and intentional.

  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement (optional)

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed secrets, tokens, personal information, confidential data, and unnecessary private conversation content from this report.
          required: true
